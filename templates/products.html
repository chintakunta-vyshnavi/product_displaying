<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Products</title>
</head>
<body>

    <h1>Our Products</h1>

    <a href="/">Home</a>

    <br><br>

    <a href="/add-product">Add New Product</a>

    <hr>

    <table>
        <tr>
            {% for product in products %}

            <td>
                <img
                    src="{{ product.image_url }}"
                    alt="{{ product.name }}"
                    width="150"
                    height="150"
                >

                <h3>{{ product.name }}</h3>

                <p>{{ product.description }}</p>

                <p>Price: ₹{{ product.price }}</p>

                <a href="/product/{{ product.id }}">
                    View Details
                </a>

            </td>

            {% if loop.index % 4 == 0 %}
        </tr>
        <tr>
            {% endif %}

            {% endfor %}
        </tr>
    </table>

</body>
</html>
